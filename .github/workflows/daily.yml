name: BD Stock Monitor

on:
  # Scheduled notifications are paused; use workflow_dispatch for an on-demand run.
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check official store stock and send ServerChan notification
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SERVERCHAN_SENDKEY_2: ${{ secrets.SERVERCHAN_SENDKEY_2 }}
          DOUYIN_PRODUCT_URL: ${{ vars.DOUYIN_PRODUCT_URL }}
          PINDUODUO_PRODUCT_URL: ${{ vars.PINDUODUO_PRODUCT_URL }}
          DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
          PINDUODUO_COOKIE: ${{ secrets.PINDUODUO_COOKIE }}
        run: python stock_monitor.py
